services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gearflow_operation
      POSTGRES_USER: gearflow
      POSTGRES_PASSWORD: ${OPERATION_POSTGRES_PASSWORD:-operation_local_only}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - operation_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearflow -d gearflow_operation"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  operation_data:
