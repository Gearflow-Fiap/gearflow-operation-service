apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gearflow
resources:
  - ../overlays/integration
  - postgres.yaml
  - storage.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gearflow-operation
      spec:
        replicas: 1
        template:
          spec:
            imagePullSecrets: null
