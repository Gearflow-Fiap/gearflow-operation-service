apiVersion: batch/v1
kind: Job
metadata:
  generateName: gearflow-operation-migrate-
  namespace: gearflow
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: gearflow-operation-registry
      containers:
        - name: migrate
          image: gearflow-operation-service:local
          command: ["dotnet", "/app/migrate/Operation.Migrate.dll", "--apply"]
          envFrom:
            - secretRef:
                name: gearflow-operation-migrations
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
