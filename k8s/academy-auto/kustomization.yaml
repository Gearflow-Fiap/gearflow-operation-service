apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../academy]
patches:
  - target: {kind: StorageClass, name: gearflow-operation-gp3}
    patch: |-
      - op: replace
        path: /metadata/name
        value: gearflow-operation-gp3-auto
      - op: replace
        path: /provisioner
        value: ebs.csi.eks.amazonaws.com
      - op: add
        path: /allowedTopologies
        value:
          - matchLabelExpressions:
              - key: eks.amazonaws.com/compute-type
                values: [auto]
  - target: {kind: StatefulSet, name: operation-postgres}
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gearflow-operation-gp3-auto
