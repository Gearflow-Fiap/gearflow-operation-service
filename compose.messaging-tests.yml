name: gearflow-operation-messaging-tests
services:
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: operation_test
      RABBITMQ_DEFAULT_PASS: operation_test_only
    ports:
      - "127.0.0.1:5674:5672"
      - "127.0.0.1:15674:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
