name: Operation delivery
on:
  workflow_run:
    workflows: [Operation CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: operation-delivery-main
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: src/Operation.Api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    environment: operation-homologation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/contract_requirements.txt
      - name: Configure only selected EKS context
        env:
          CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
      - name: Apply release after controlled migration
        env:
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          test -n "$IMAGE"
          kubectl set image --local -f k8s/migration-job.yaml migrate="$IMAGE" -o yaml > "$RUNNER_TEMP/migrate.yaml"
          job=$(kubectl create -f "$RUNNER_TEMP/migrate.yaml" -o jsonpath='{.metadata.name}')
          kubectl wait --for=condition=complete "job/$job" -n gearflow --timeout=120s
          python scripts/prepare_release.py "$IMAGE"
          kubectl apply -k k8s/overlays/release
          kubectl rollout status deployment/gearflow-operation -n gearflow --timeout=180s

