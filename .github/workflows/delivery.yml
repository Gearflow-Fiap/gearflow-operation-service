name: Operation Academy EKS
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Operation CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: operation-delivery
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    environment: academy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || vars.EKS_CLUSTER_NAME }}
      BROKER_SECRET: ${{ vars.OPERATION_BROKER_SECRET || 'rabbitmq-operation-credentials' }}
      BROKER_USER: ${{ vars.OPERATION_BROKER_USER || 'gearflow_operation' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          dotnet-version: '10.0.x'
      - name: Test manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: dotnet test GearFlow.Operation.CI.slnf -c Release
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Select cluster and storage profile
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" && test -n "$EKS_CLUSTER_NAME"
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          version=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --query cluster.version --output text)
          echo "KUBECTL_VERSION=v$version.0" >> "$GITHUB_ENV"
          auto=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --query cluster.computeConfig.enabled --output text)
          profile=k8s/academy
          if [[ "$auto" == True || "$auto" == true ]]; then profile=k8s/academy-auto; fi
          echo "DEPLOY_DIR=$profile" >> "$GITHUB_ENV"
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: Require shared broker and prepare namespace
        run: |
          set -euo pipefail
          kubectl rollout status statefulset/rabbitmq -n messaging --timeout=120s
          kubectl create namespace gearflow --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace gearflow gearflow.io/messaging-access=true --overwrite
      - name: Configure service secrets
        env:
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python scripts/configure_academy.py
      - name: Configure Inventory service credential
        env:
          INVENTORY_JWT_SIGNING_KEY: ${{ secrets.INVENTORY_JWT_SIGNING_KEY || secrets.JWT_SIGNING_KEY }}
          INVENTORY_JWT_ISSUER: ${{ vars.INVENTORY_JWT_ISSUER || 'GearFlow.Api' }}
          INVENTORY_JWT_AUDIENCE: ${{ vars.INVENTORY_JWT_AUDIENCE || 'GearFlow.Client' }}
          INVENTORY_TOKEN_TTL_MINUTES: ${{ vars.INVENTORY_TOKEN_TTL_MINUTES || '10080' }}
        run: python scripts/configure_inventory.py
      - name: Prepare ECR
        id: registry
        run: |
          set -euo pipefail
          repo=gearflow-operation
          if ! aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$repo" --image-tag-mutability IMMUTABLE >/dev/null
          fi
          uri=$(aws ecr describe-repositories --repository-names "$repo" --query 'repositories[0].repositoryUri' --output text)
          echo "uri=$uri" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse HEAD)-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${uri%%/*}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: src/Operation.Api/Dockerfile
          push: true
          tags: ${{ steps.registry.outputs.uri }}:${{ steps.registry.outputs.tag }}
      - name: Render release and start database
        env:
          IMAGE: ${{ steps.registry.outputs.uri }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p k8s/academy-release
          printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: [../%s]\nimages:\n  - name: gearflow-operation-service\n    newName: %s\n    digest: %s\n' "${DEPLOY_DIR#k8s/}" "${IMAGE%@*}" "${IMAGE#*@}" > k8s/academy-release/kustomization.yaml
          kubectl kustomize k8s/academy-release > "$RUNNER_TEMP/release.yaml"
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/release.yaml"
          # Apply infrastructure before the API: migrations must finish before new pods start.
          kubectl apply -f "$RUNNER_TEMP/release.yaml" --selector=gearflow.io/academy-infrastructure=true
          kubectl rollout status statefulset/operation-postgres -n gearflow --timeout=600s
      - name: Apply schema migration with the release image
        env:
          IMAGE: ${{ steps.registry.outputs.uri }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          kubectl set image --local -f k8s/academy/migration-job.yaml migrate="$IMAGE" -o yaml > "$RUNNER_TEMP/migrate.yaml"
          job=$(kubectl create -f "$RUNNER_TEMP/migrate.yaml" -o jsonpath='{.metadata.name}')
          kubectl wait --for=condition=complete "job/$job" -n gearflow --timeout=120s
      - name: Deploy and verify
        run: |
          set -euo pipefail
          kubectl apply -f "$RUNNER_TEMP/release.yaml"
          kubectl rollout status deployment/gearflow-operation -n gearflow --timeout=600s
          kubectl port-forward -n gearflow service/gearflow-operation 18080:8080 > "$RUNNER_TEMP/forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,pvc,jobs -n gearflow || true
          kubectl get events -n gearflow --sort-by=.lastTimestamp | tail -40 || true
