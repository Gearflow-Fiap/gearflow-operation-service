name: Operation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: operation_test_admin
          POSTGRES_USER: operation_test
          POSTGRES_PASSWORD: operation_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U operation_test -d operation_test_admin"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OPERATION_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=operation_test_admin;Username=operation_test;Password=operation_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: dotnet restore GearFlow.Operation.slnx
      - run: dotnet build GearFlow.Operation.slnx --no-restore --configuration Release
      - run: dotnet test GearFlow.Operation.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults
      - run: python scripts/check_coverage.py TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operation-test-coverage
          path: TestResults
