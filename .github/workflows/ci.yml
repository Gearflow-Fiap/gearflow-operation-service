name: Core CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: dotnet restore GearFlow.Operation.slnx
      - run: dotnet build GearFlow.Operation.slnx --no-restore --configuration Release
      - run: dotnet test GearFlow.Operation.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults
      - run: python scripts/check_coverage.py TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-coverage
          path: TestResults
